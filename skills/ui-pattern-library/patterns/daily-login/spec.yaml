id: PAT-daily-login
type: ui_screen
kind: popup_fullscreen
fidelity: faithful
pattern: ui-pattern-library/daily-login
reference_canvas: {w: 1920, h: 1080, match: 0.5}
states: [claimed, today, missed, upcoming]
elements:
  - {n: 1, name: Title_Bar, anchor: stretch-top, rect: {top: 0, left: 0, right: 0, bottom: 905}, container: true}
  - {n: 2, name: Btn_Back, anchor: top-left, pos: [98.5, -87], size: [103, 107], behaviour: close}
  - {n: 3, name: Text_Title, anchor: top-center, pos: [0, -87], size: [200, 50], text: {key: ui.daily.title, auto_size: true}}
  - {n: 4, name: Scroll_Cards, anchor: center, pos: [0, -27], size: [1920, 700], container: true}
  - {n: 5, name: Card_Claimed, anchor: center, pos: [-500, -27], size: [431, 617]}
  - {n: 6, name: Card_Today, anchor: center, pos: [0, -27], size: [455, 632], behaviour: claim}
  - {n: 7, name: Card_Upcoming, anchor: center, pos: [500, -27], size: [431, 617]}
  - {n: 8, name: Scrollbar, anchor: center, pos: [0, -420], size: [500, 20]}
