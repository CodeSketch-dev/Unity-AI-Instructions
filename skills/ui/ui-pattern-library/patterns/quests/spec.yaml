  - {n: 7, name: Row_2, anchor: center, pos: [0, -20], size: [960, 120], container: true}
  - {n: 8, name: Progress_2, anchor: center, pos: [-170, -20], size: [560, 40]}
  - {n: 9, name: Claim_2, anchor: center, pos: [360, -20], size: [200, 80], behaviour: claim}
  - {n: 10, name: Row_3, anchor: center, pos: [0, -150], size: [960, 120], container: true}
  - {n: 11, name: Progress_3, anchor: center, pos: [-170, -150], size: [560, 40]}
  - {n: 12, name: Claim_3, anchor: center, pos: [360, -150], size: [200, 80], behaviour: claim}
  - {n: 13, name: Btn_Reroll, anchor: center, pos: [0, -270], size: [300, 80], behaviour: reroll_ad}
